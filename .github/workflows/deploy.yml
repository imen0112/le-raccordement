name: Deploy to GitHub Pages

on:
  # Run on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant the workflow the permissions Pages needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time — newer pushes cancel queued ones,
# but never cancel an in-flight one (so a deploy mid-flight finishes).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check catalog pages and quote API
        run: |
          python3 tools/catalog/check_site.py
          cd server/quote-api && python3 -m unittest test_app

      - name: Assemble public site (without tools, server code and tests)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools' \
            --exclude 'server' --exclude 'tests' --exclude 'README.md' --exclude '.DS_Store' --exclude '.gitignore' --exclude 'CNAME.example' \
            --exclude 'assets/certifications' ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
